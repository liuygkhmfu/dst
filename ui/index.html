<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电商图 AI 工作台</title>
  <style>
    :root { --ink:#18232d; --muted:#74808c; --line:#e6ebef; --soft:#f5f7f8; --paper:#fff; --accent:#2e7d6d; --accent2:#dff2ec; --orange:#d67d39; --danger:#c44d4d; --shadow:0 12px 32px rgba(22,38,50,.07); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#f7f8f8; font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    button, input, textarea, select { font:inherit; }
    button { cursor:pointer; border:0; }
    .app { min-height:100vh; display:grid; grid-template-columns:280px 1fr; }
    .sidebar { background:#14211f; color:#ecf4f0; padding:26px 18px; display:flex; flex-direction:column; gap:20px; }
    .brand { padding:4px 12px 14px; border-bottom:1px solid rgba(255,255,255,.12); }
    .brand b { display:block; font-size:20px; letter-spacing:.02em; }
    .brand span { display:block; color:#a8bdb5; font-size:12px; margin-top:7px; }
    .side-title { display:flex; align-items:center; justify-content:space-between; color:#a8bdb5; font-size:12px; padding:0 8px; }
    .project-list { display:flex; flex-direction:column; gap:6px; overflow:auto; }
    .project-item { color:#e8f0ed; background:transparent; text-align:left; padding:12px; border-radius:12px; display:block; width:100%; }
    .project-item:hover, .project-item.active { background:rgba(255,255,255,.1); }
    .project-item strong { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:13px; }
    .project-item small { display:block; color:#9cb2aa; font-size:11px; margin-top:5px; }
    .main { padding:30px 34px 60px; max-width:1600px; width:100%; margin:auto; }
    .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
    h1 { font-size:28px; line-height:1.2; margin:0 0 8px; letter-spacing:-.03em; }
    h2 { font-size:20px; margin:0; letter-spacing:-.02em; }
    h3 { font-size:15px; margin:0; }
    p { color:var(--muted); margin:0; line-height:1.7; font-size:13px; }
    .eyebrow { color:var(--accent); font-weight:700; font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:9px; }
    .btn { border-radius:10px; padding:10px 14px; font-weight:650; font-size:13px; transition:.15s; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn-primary { background:var(--accent); color:white; box-shadow:0 5px 14px rgba(46,125,109,.2); }
    .btn-primary:hover:not(:disabled) { background:#246656; transform:translateY(-1px); }
    .btn-ghost { background:#edf2f1; color:#31574f; }
    .btn-light { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .btn-danger { color:var(--danger); background:#fff0f0; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:24px; }
    .empty { min-height:420px; display:grid; place-items:center; text-align:center; }
    .empty-inner { max-width:420px; }
    .empty-mark { width:70px; height:70px; border-radius:22px; display:grid; place-items:center; margin:0 auto 18px; background:var(--accent2); color:var(--accent); font-size:30px; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .field { display:flex; flex-direction:column; gap:7px; }
    .field.full { grid-column:1/-1; }
    label { font-weight:700; font-size:13px; }
    .hint { font-size:11px; color:var(--muted); font-weight:400; }
    input[type=text], input[type=number], input[type=file], textarea, select { width:100%; border:1px solid #dce3e4; border-radius:10px; padding:10px 11px; color:var(--ink); background:#fcfdfd; outline:0; }
    input:focus, textarea:focus, select:focus { border-color:#83bdb0; box-shadow:0 0 0 3px rgba(46,125,109,.1); }
    textarea { min-height:90px; resize:vertical; line-height:1.6; }
    input[type=file] { padding:8px; font-size:12px; }
    .section { margin-top:28px; padding-top:22px; border-top:1px solid var(--line); }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .logic-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; padding:6px; background:var(--soft); border:1px solid var(--line); border-radius:13px; }
    .logic-tab { flex:1; min-width:120px; padding:11px 14px; border-radius:9px; color:#52625e; background:transparent; font-weight:750; }
    .logic-tab.active { color:#fff; background:var(--accent); box-shadow:0 5px 14px rgba(46,125,109,.18); }
    .constraint-panel { display:none; padding:18px; border:1px solid #dfe9e6; border-radius:14px; background:#fbfdfc; }
    .constraint-panel.active { display:block; }
    .constraint-panel > p { margin-bottom:14px; }
    .group-constraint { min-height:190px; }
    .settings-task-list { margin-top:18px; padding-top:18px; border-top:1px dashed #d8e4e0; }
    .size-template-list { display:flex; flex-direction:column; gap:14px; margin-top:16px; }
    .size-template-row { padding:15px; border:1px solid #dfe9e6; border-radius:12px; background:#fff; }
    .size-template-head { display:grid; grid-template-columns:minmax(0,260px) 1fr auto; gap:10px; align-items:end; margin-bottom:10px; }
    .size-template-prompt { min-height:260px; }
    .variable-guide { margin:14px 0 18px; padding:14px; border:1px solid #dbe7e3; border-radius:12px; background:#f7fbfa; }
    .variable-guide > p { margin-bottom:10px; }
    .variable-chips { display:flex; flex-wrap:wrap; gap:8px; }
    .variable-chip { padding:7px 9px; border-radius:8px; background:#fff; border:1px solid var(--line); font-size:11px; color:#52625e; }
    .variable-chip code { color:var(--accent); font-weight:800; }
    button.variable-chip.active { background:#e5f3ef; border-color:#69a999; color:#1b6656; }
    .variable-toggle { display:inline-block; margin-left:5px; font-weight:800; color:#7f918c; }
    button.variable-chip.active .variable-toggle { color:#b64040; }
    .task-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
    .task-option { padding:11px; background:var(--soft); border:1px solid var(--line); border-radius:10px; display:flex; gap:9px; align-items:flex-start; font-size:12px; font-weight:600; }
    .task-option input { accent-color:var(--accent); margin-top:2px; }
    .extra-list { display:flex; flex-direction:column; gap:12px; }
    .extra-row { border:1px solid #dfe9e6; border-radius:14px; background:#fbfdfc; padding:15px; display:grid; grid-template-columns:36px 1fr 34px; gap:12px; align-items:start; }
    .extra-num { width:28px; height:28px; border-radius:50%; background:var(--accent2); color:var(--accent); display:grid; place-items:center; font-size:12px; font-weight:800; }
    .extra-fields { display:grid; gap:10px; }
    .remove-extra { background:transparent; color:var(--muted); font-size:20px; line-height:1; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:28px; }
    .workspace-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
    .head-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:20px 0; }
    .stat { border:1px solid var(--line); border-radius:13px; padding:14px; background:#fbfcfc; }
    .stat b { display:block; font-size:22px; margin-bottom:2px; }
    .stat span { color:var(--muted); font-size:11px; }
    .ref-strip { display:flex; align-items:center; gap:12px; border-top:1px solid var(--line); padding-top:16px; }
    .ref-thumb { width:62px; height:62px; object-fit:cover; border-radius:10px; border:1px solid var(--line); background:#eef2f1; }
     .logic-section { margin-top:24px; }
     .logic-section h3 { color:var(--accent); font-size:15px; margin-bottom:10px; }
     .task-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .task-card { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 7px 22px rgba(22,38,50,.045); }
    .task-card.extra { border-color:#c8e4dc; }
    .task-card.agent { border-color:#b9d8ef; }
    .card-top { display:flex; justify-content:space-between; gap:10px; padding:15px 16px 12px; }
    .task-id { color:var(--accent); font-weight:800; margin-right:5px; }
    .status { border-radius:99px; padding:4px 8px; font-size:10px; font-weight:800; white-space:nowrap; background:#edf2f1; color:#5b6d68; }
    .status.generating, .status.queued { background:#fff2dc; color:#a36724; }
    .status.ready, .status.approved { background:#e0f3ec; color:#2d7867; }
    .status.failed { background:#fff0f0; color:var(--danger); }
    .card-top-actions { display:flex; align-items:center; gap:7px; flex-shrink:0; }
    .favorite-btn { border:1px solid #e7d8a7; border-radius:99px; padding:4px 9px; color:#926f16; background:#fffaf0; font-size:10px; font-weight:800; white-space:nowrap; }
    .favorite-btn:hover:not(:disabled) { color:#6f5105; background:#fff1c7; }
    .favorite-btn:disabled { opacity:.55; cursor:not-allowed; }
    .image-box { background:#f1f3f2; aspect-ratio:1/1; display:grid; place-items:center; overflow:hidden; }
    .image-box img { width:100%; height:100%; object-fit:cover; display:block; }
    .image-placeholder { color:var(--muted); font-size:12px; padding:20px; text-align:center; }
    .card-body { padding:15px 16px 16px; }
    .version-row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
    .version-row span { font-size:11px; color:var(--muted); }
    .version-select { padding:7px 8px; font-size:11px; width:auto; max-width:210px; }
    .card-body textarea { min-height:115px; font-size:12px; }
    .edit-box { margin-top:10px; min-height:70px !important; }
    .card-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:11px; }
    .card-actions .btn { padding:8px 10px; font-size:11px; }
    .card-foot { border-top:1px solid var(--line); padding-top:11px; margin-top:12px; color:var(--muted); font-size:11px; line-height:1.5; }
    .error { color:var(--danger); background:#fff5f5; border-radius:9px; padding:8px; margin-top:10px; font-size:11px; white-space:pre-wrap; }
    .toast { position:fixed; right:24px; bottom:24px; z-index:5; padding:13px 16px; color:#fff; background:#182b27; border-radius:11px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s; font-size:13px; }
    .toast.show { opacity:1; transform:translateY(0); }
    .hidden { display:none !important; }
    .progress-line { height:6px; border-radius:6px; overflow:hidden; background:#e8eeec; margin:15px 0 5px; }
    .progress-line i { display:block; height:100%; background:var(--accent); border-radius:6px; transition:width .25s; }
    .notice { border-left:3px solid var(--orange); background:#fff9f1; color:#7e5a38; padding:11px 13px; border-radius:7px; font-size:12px; line-height:1.6; }
    .agent-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(360px,.9fr); gap:18px; align-items:start; }
    .agent-list { display:grid; gap:12px; }
    .agent-card { border:1px solid #dce6ed; border-radius:14px; padding:16px; background:#fbfdff; }
    .agent-card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .agent-card-actions { display:flex; gap:7px; }
    .agent-meta { display:flex; gap:7px; flex-wrap:wrap; margin:10px 0; }
    .agent-tag { padding:5px 8px; border-radius:99px; background:#eaf4fb; color:#35647d; font-size:10px; font-weight:800; }
    .agent-prompt-preview { color:#52616b; font-size:12px; line-height:1.65; white-space:pre-wrap; max-height:96px; overflow:hidden; }
    .agent-refs { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .agent-ref { width:66px; }
    .agent-ref img { width:66px; height:66px; object-fit:cover; display:block; border-radius:9px; border:1px solid var(--line); background:#eef2f1; }
    .agent-ref span { display:block; margin-top:4px; color:var(--muted); font-size:9px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .agent-editor { position:sticky; top:18px; }
    .agent-editor textarea { min-height:240px; }
    .agent-existing-refs { display:flex; flex-wrap:wrap; gap:9px; }
    .agent-keep-ref { width:82px; padding:7px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:10px; }
    .agent-keep-ref img { width:66px; height:66px; object-fit:cover; border-radius:7px; display:block; margin-bottom:5px; }
    .agent-keep-ref label { display:flex; gap:4px; align-items:center; font-size:10px; }
    .agent-parameter-list { display:grid; gap:10px; }
    .agent-parameter-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fbfcfc; align-items:end; }
    .agent-parameter-options { display:flex; gap:12px; align-items:center; min-height:42px; font-size:11px; }
    .agent-runtime-fields { display:grid; gap:10px; padding:12px; border:1px dashed #bdd8cd; border-radius:12px; background:#f7fbf9; }
    .agent-runtime-text-fields { display:grid; gap:10px; }
    .agent-run-layout { display:grid; grid-template-columns:minmax(350px,.8fr) minmax(0,1.2fr); gap:18px; align-items:start; }
    #agent-run-form textarea[name=prompt] { min-height:240px; }
    .agent-run-result img { width:100%; max-height:680px; object-fit:contain; border-radius:14px; background:#edf1ef; }
    .agent-run-result textarea { min-height:180px; }
    .agent-request-config { margin-top:10px; padding:12px; border:1px dashed #b9d8ef; border-radius:12px; background:#f8fcff; }
    .agent-request-config .field { margin-top:9px; }
    @media (max-width:1000px) { .app{grid-template-columns:1fr;} .sidebar{min-height:auto; padding:16px;}.project-list{flex-direction:row;}.project-item{min-width:190px;} .task-options{grid-template-columns:repeat(2,1fr);} }
    @media (max-width:900px) { .agent-layout,.agent-run-layout{grid-template-columns:1fr;} .agent-editor{position:static;} .agent-parameter-row{grid-template-columns:1fr;} }
    @media (max-width:700px) { .main{padding:20px 14px 40px;} .form-grid,.task-grid{grid-template-columns:1fr;} .stats{grid-template-columns:repeat(2,1fr);} .task-options{grid-template-columns:1fr;} .topbar,.workspace-head{display:block;} .head-actions{justify-content:flex-start; margin-top:16px;} }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><b>电商图 AI 工作台</b><span>本地生成 · 审核 · 版本管理</span></div>
      <div class="side-title"><span>我的项目</span><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost" id="side-agents">Agents</button><button class="btn btn-ghost" id="side-settings">设置</button><button class="btn btn-ghost" id="side-new">+ 新建</button></div></div>
      <div class="project-list" id="project-list"></div>
    </aside>
    <main class="main">
      <section class="topbar"><div><div class="eyebrow">LOCAL IMAGE STUDIO</div><h1 id="page-title">从一张产品图开始</h1><p id="page-subtitle">将工作流里的业务规则变成可以预览、审核和迭代的图片任务。</p></div><button class="btn btn-primary" id="top-new">新建项目</button></section>
      <section id="view"></section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const state = { projects: [], project: null, viewVersions: {}, promptDrafts: {}, editDrafts: {}, functionTemplates: [], agents: [], agentSizeOptions: [], agentQualityOptions: [], agentProjectVariables: [], agentRunResults: {}, poll: null };
    const $ = (s, root=document) => root.querySelector(s);
    const $$ = (s, root=document) => [...root.querySelectorAll(s)];
    const esc = (v='') => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date = v => v ? new Date(v).toLocaleString('zh-CN', {hour12:false}) : '';
    const toast = (msg) => { const el=$('#toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2600); };
    const api = async (url, options={}) => { const res=await fetch(url, options); const data=await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.error || `请求失败（${res.status}）`); return data; };
    const fileUrl = (projectId, path) => `/api/files?project=${encodeURIComponent(projectId)}&path=${encodeURIComponent(path)}`;
    const agentRunFileUrl = (agentId, path) => `/api/agent-run-files?agent=${encodeURIComponent(agentId)}&path=${encodeURIComponent(path)}`;
    const agentReferenceFileUrl = (agentId, path) => `/api/agent-reference-files?agent=${encodeURIComponent(agentId)}&path=${encodeURIComponent(path)}`;

    function renderPromptVariables(s) {
      return `<div class="variable-guide"><p><b>可用工作流占位词</b> · 模板中保留双花括号，生成描述词时后端按当前项目替换实际值；图片变量会继续映射到实际上传顺序。</p><div class="variable-chips">${(s.prompt_variables||[]).map(v=>`<span class="variable-chip"><code>{{${esc(v.name)}}}</code> · ${esc(v.kind)} · ${esc(v.source)}</span>`).join('')}</div></div>`;
    }

    function renderSizeTemplateRows(templates=[]) {
      return `<div class="size-template-list">${templates.map((t,i)=>`<div class="size-template-row" data-template-id="${esc(t.id)}"><div class="size-template-head"><div class="field"><label>模板名称</label><input class="size-template-name" type="text" value="${esc(t.name||`功能图模板${i+1}`)}"></div><p>这是一张功能图的完整描述词生成要求，可使用工作流占位词；模板之间互不拼接。</p><button type="button" class="btn btn-danger" data-action="remove-size-template">删除模板</button></div><textarea class="size-template-prompt" placeholder="请输入尺寸图、卖点图、结构图等功能图的完整生成要求">${esc(t.prompt||'')}</textarea></div>`).join('')}</div>`;
    }

    function renderPromptDesign(s) {
      const groups=s.prompt_groups||[];
      const panels=groups.map((g,i)=>{
        if(g.key==='size') return `<section class="constraint-panel ${i===0?'active':''}" data-prompt-panel="size"><p><b>功能图使用可选完整模板</b> · 每个模板可以是尺寸图、卖点图、结构图或其他功能性图片要求；选择后会结合参考图单独交给 GPT-5.5 重写，不与其他模板或全局约束拼接。</p>${renderSizeTemplateRows(s.function_templates||s.size_templates||[])}<button type="button" class="btn btn-ghost" style="margin-top:14px" data-action="add-size-template">+ 新增功能图模板</button></section>`;
        const tasks=(s.task_templates||[]).filter(d=>d.prompt_group===g.key);
        return `<section class="constraint-panel ${i===0?'active':''}" data-prompt-panel="${esc(g.key)}"><p><b>${esc(g.label)}专属全局约束</b> · ${esc(g.description)}</p><textarea class="group-constraint" data-group="${esc(g.key)}">${esc(s.group_constraints?.[g.key]||'')}</textarea><div class="settings-task-list"><h3>${esc(g.label)}的单图要求</h3><p style="margin:6px 0 14px">每一条与本类型全局约束、相关用户字段和参考图一起交给 GPT-5.5，重写为该图片独立的完整中文描述词。</p>${tasks.map(d=>`<div class="field" style="margin-bottom:14px"><label><span class="task-id">图${esc(d.id)}</span>${esc(d.name)} <span class="hint">${esc(d.logic||d.prompt_group)}</span></label><textarea class="settings-task" data-task-id="${esc(d.id)}">${esc(d.brief)}</textarea></div>`).join('')}</div></section>`;
      }).join('');
      return `<div class="section"><div class="section-head"><div><h2>三类描述词设计</h2><p>功能图选择一套完整模板；氛围摆放图和场景图分别使用自己的全局约束与单图要求。</p></div></div><div class="notice"><b>当前处理逻辑：</b>功能图 = 当前所选完整模板 + 相关用户字段 + 参考图，单独交给 GPT-5.5 重写；氛围/场景图 = 本类型全局约束 + 当前单图要求 + 允许使用的用户字段 + 参考图，分别交给 GPT-5.5 重写。stt/cpt 的参考角色约束会在请求中自动注入。</div>${renderPromptVariables(s)}<div class="logic-tabs">${groups.map((g,i)=>`<button type="button" class="logic-tab ${i===0?'active':''}" data-action="prompt-tab" data-group="${esc(g.key)}">${esc(g.label)}</button>`).join('')}</div>${panels}</div>`;
    }

    function addSizeTemplate() {
      const list=$('.size-template-list');
      if(!list) return;
      const index=list.children.length;
      const seed=$('.size-template-prompt',list)?.value||'';
      const wrap=document.createElement('div');
      wrap.innerHTML=renderSizeTemplateRows([{id:`function-${Date.now()}`,name:`功能图模板${index+1}`,prompt:seed}]);
      list.appendChild(wrap.firstElementChild.firstElementChild);
    }

    function functionTemplateOptions(selected='') {
      return state.functionTemplates.map((t,i)=>`<option value="${esc(t.id)}" ${(selected?selected===t.id:i===0)?'selected':''}>${esc(t.name)}</option>`).join('');
    }

    function functionSourceOptions(selected='') {
      const templates=state.functionTemplates.map(t=>`<option value="template:${esc(t.id)}" ${selected===`template:${t.id}`?'selected':''}>功能图模板 · ${esc(t.name)}</option>`);
      const agents=state.agents.map(a=>`<option value="agent:${esc(a.id)}" ${selected===`agent:${a.id}`?'selected':''}>Agent · ${esc(a.name)} · ${esc(a.image_size)} / ${esc(a.image_quality)}</option>`);
      return [...templates,...agents].join('');
    }

    function agentProjectVariableDetails(agent) {
      const used=new Set(agent?.project_variables||[]);
      return state.agentProjectVariables.filter(item=>used.has(item.name));
    }

    function renderAgentRequestConfig(agent) {
      if(!agent) return '';
      const variables=agentProjectVariableDetails(agent);
      const chips=variables.map(item=>`<span class="variable-chip"><code>{{${esc(item.name)}}}</code> · ${esc(item.source)}</span>`).join('');
      const needsTaskRefs=(agent.project_variables||[]).includes('Agent参考图');
      const fixedReferenceCount=(agent.reference_paths||[]).length;
      const requiresTaskUpload=needsTaskRefs&&!fixedReferenceCount;
      const needsCpt=(agent.project_variables||[]).some(name=>name==='cpt'||name==='系列外观参考图');
      return `<div class="agent-request-config" data-agent-config="${esc(agent.id)}"><div class="notice"><b>自动绑定本页真实输入</b> · 文字变量读取上方表单；stt/cpt 分别绑定上方上传的真实文件。${fixedReferenceCount?`此 Agent 还会自动携带 ${fixedReferenceCount} 张固定任务参考图。`:''}${needsCpt?'<br><b>此 Agent 直接引用 cpt：</b>请把产品类型选为“系列品”，并在上方上传 cpt 系列外观参考图。':''}</div>${chips?`<div class="variable-chips" style="margin-top:10px">${chips}</div>`:'<p class="hint" style="margin-top:10px">此 Agent 描述词尚未引用新建项目变量。</p>'}<div class="field"><label>本次临时追加参考图 <span class="hint">${requiresTaskUpload?'描述词使用了 {{Agent参考图}} 且没有固定参考图，至少上传1张':fixedReferenceCount?'可选；会与 Agent 固定参考图一起参与当前任务':'可选；用于补充当前任务的构图、风格或动作'}</span></label><input class="agent-request-files" type="file" accept=".jpg,.jpeg,.png,.webp" multiple ${requiresTaskUpload?'required':''}></div></div>`;
    }

    function updateFunctionRequestRow(row) {
      const [sourceType,sourceId]=($('.function-source-select',row)?.value||'').split(':',2);
      let holder=$('.function-dynamic',row);
      if(!holder) return;
      const agent=sourceType==='agent'?state.agents.find(item=>item.id===sourceId):null;
      holder.innerHTML=renderAgentRequestConfig(agent);
      const nameInput=$('.function-task-name',row);
      if(nameInput && !nameInput.value) {
        const template=sourceType==='template'?state.functionTemplates.find(item=>item.id===sourceId):agent;
        nameInput.placeholder=template?.name||'功能图';
      }

    function addFunctionRequest() {
      const list=$('#function-request-list');
      if(!list || (!state.functionTemplates.length&&!state.agents.length)) return toast('请先保存功能图模板或创建 Agent');

      row.className='extra-row function-request-row';
      row.innerHTML=`<div class="extra-num">${index+1}</div><div class="extra-fields"><div class="field"><label>选择功能图模板或 Agent</label><select class="function-source-select">${functionSourceOptions()}</select></div><div class="field"><label>本张图片名称 <span class="hint">留空则使用模板或 Agent 名称</span></label><input class="function-task-name" type="text" placeholder="功能图"></div><div class="function-dynamic"></div></div><button type="button" class="remove-extra" data-action="remove-function" title="删除">×</button>`;

    async function submitSettingsFixed(form) {
      const task_briefs={};
      $$('.settings-task',form).forEach(el=>task_briefs[el.dataset.taskId]=el.value);
      const group_constraints={};
      $$('.group-constraint',form).forEach(el=>group_constraints[el.dataset.group]=el.value);
      const function_templates=$$('.size-template-row',form).map(row=>({
        id:row.dataset.templateId,
        name:$('.size-template-name',row).value,
        prompt:$('.size-template-prompt',row).value
      }));
      const payload={
        output_root:$('[name=output_root]',form).value,

        image_api_key:$('[name=image_api_key]',form).value,
        image_model:$('[name=image_model]',form).value,
        image_size:$('[name=image_size]',form).value,
        image_quality:$('[name=image_quality]',form).value,
        image_moderation:$('[name=image_moderation]',form).value,
        image_output_format:$('[name=image_output_format]',form).value,
        prompt_api_base_url:$('[name=prompt_api_base_url]',form).value,
        prompt_api_key:$('[name=prompt_api_key]',form).value,
        prompt_model:$('[name=prompt_model]',form).value,
        generation_concurrency:$('[name=generation_concurrency]',form).value,
        api_timeout_seconds:$('[name=api_timeout_seconds]',form).value,
        max_upload_mb:$('[name=max_upload_mb]',form).value,

        runtime:{group_constraints,task_briefs,function_templates}
      };
      const button=$('button[type=submit]',form);
      button.disabled=true;
      button.textContent='保存中…';
      try {

    function agentOptionLabel(options,value) {
      return options.find(option=>option.value===value)?.label||value;
    }

    function renderAgentCard(agent) {
      const refs=(agent.reference_paths||[]);
      return `<article class="agent-card"><div class="agent-card-head"><div><h3>${esc(agent.name)}</h3><div class="agent-meta"><span class="agent-tag">${esc(agentOptionLabel(state.agentSizeOptions,agent.image_size))}</span><span class="agent-tag">清晰度：${esc(agentOptionLabel(state.agentQualityOptions,agent.image_quality))}</span><span class="agent-tag">引用 ${(agent.project_variables||[]).length} 个项目变量</span><span class="agent-tag">固定参考图 ${refs.length} 张</span></div></div><div class="agent-card-actions"><button type="button" class="btn btn-primary" data-action="run-agent" data-agent-id="${esc(agent.id)}">打开 Agent 工作台</button><button type="button" class="btn btn-danger" data-action="delete-agent" data-agent-id="${esc(agent.id)}">删除</button></div></div><div class="agent-prompt-preview">${esc(agent.prompt)}</div>${refs.length?`<div class="agent-refs">${refs.map((path,index)=>`<div class="agent-ref"><img src="${agentReferenceFileUrl(agent.id,path)}" alt="固定参考图${index+1}"><span>固定图${index+1}</span></div>`).join('')}</div>`:''}</article>`;
    }

    function agentVariablePattern(name) {
      const escaped=String(name||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      return new RegExp(`\\{\\{\\s*${escaped}\\s*\\}\\}`,'g');
    }

    function agentPromptHasVariable(prompt,name) {
      return agentVariablePattern(name).test(String(prompt||''));
    }

    function syncAgentVariableButtons(form) {
      const prompt=$('textarea[name="prompt"]',form)?.value||'';
      $$('[data-action="insert-agent-variable"]',form).forEach(button=>{
        const active=agentPromptHasVariable(prompt,button.dataset.variable);
        button.classList.toggle('active',active);
        const label=$('.variable-toggle',button);
        if(label) label.textContent=active?'× 删除':'＋ 添加';
      });
      syncAgentWorkspaceBindings(form);
    }

    function renderAgentVariablePalette(prompt='') {
      return `<div class="variable-guide"><p><b>与“新建生成项目”完全一致的可用变量</b> · 点击变量会插入到上方 Agent 描述词光标位置；已添加的变量会高亮，再点一次即可删除。文字变量读取项目表单；stt/cpt 等图片变量除插入占位符外，运行时还会绑定对应的真实上传文件。</p><div class="variable-chips">${state.agentProjectVariables.map(item=>{const active=agentPromptHasVariable(prompt,item.name);return `<button type="button" class="variable-chip ${active?'active':''}" data-action="insert-agent-variable" data-variable="${esc(item.name)}"><code>{{${esc(item.name)}}}</code> · ${item.kind==='image'?'<b>图片上传：</b> ':''}${esc(item.source)}<span class="variable-toggle">${active?'× 删除':'＋ 添加'}</span></button>`;}).join('')}</div></div>`;
    }

    function renderAgentFixedReferences(agent) {
      const refs=agent?.reference_paths||[];
      return `<div class="field full"><label>固定 Agent 任务参考图 <span class="hint">最多8张；选择新图片并保存后，将整体替换当前固定图</span></label>${refs.length?`<div class="agent-existing-refs">${refs.map((path,index)=>`<div class="agent-keep-ref"><img src="${agentReferenceFileUrl(agent.id,path)}" alt="固定参考图${index+1}"><span>固定图${index+1}</span></div>`).join('')}</div>`:'<p class="hint fixed-reference-status">当前没有固定参考图。</p>'}<input class="agent-fixed-reference-input" type="file" accept=".jpg,.jpeg,.png,.webp" multiple><input name="clear_fixed_references" type="hidden" value="0"><div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="btn btn-light" data-action="clear-agent-fixed-refs" ${refs.length?'':'disabled'}>清空固定参考图</button><span class="hint fixed-reference-change-hint">${refs.length?'未选择新图时，保存会继续保留当前固定图。':'上传后保存，即可与 Agent 固定绑定。'}</span></div></div>`;
    }

    function renderAgentDefinitionFields(agent) {
      return `<div class="section"><div class="section-head"><div><div class="eyebrow">${agent?.id?'EDIT & TEST':'NEW AGENT'}</div><h2>Agent 定义与描述词</h2><p>定义编辑、变量增删、固定参考图和独立测试集中在同一个工作台。</p></div></div><div class="form-grid"><div class="field full"><label>Agent 名称</label><input type="text" name="name" required value="${esc(agent?.name||'')}" placeholder="例如：白底卖点图 Agent"></div><div class="field"><label>图片比例</label><select name="image_size">${state.agentSizeOptions.map(option=>`<option value="${esc(option.value)}" ${(agent?.image_size||'1024x1024')===option.value?'selected':''}>${esc(option.label)}</option>`).join('')}</select></div><div class="field"><label>图片清晰度</label><select name="image_quality">${state.agentQualityOptions.map(option=>`<option value="${esc(option.value)}" ${(agent?.image_quality||'medium')===option.value?'selected':''}>${esc(option.label)}</option>`).join('')}</select></div><div class="field full"><label>Agent 功能与完整描述词要求 <span class="hint">可实时编辑；运行时先保存当前版本，再按此描述词出图</span></label><textarea name="prompt" required placeholder="写明这张图要解决什么问题，并插入需要读取的新建项目变量">${esc(agent?.prompt||'')}</textarea></div><div class="field full">${renderAgentVariablePalette(agent?.prompt||'')}</div>${renderAgentFixedReferences(agent)}<div class="field full"><div class="notice"><b>追加套图时：</b>stt/cpt 使用新建项目顶部上传的真实图片；固定 Agent 任务参考图自动随 Agent 参与出图，本次临时参考图仅作为补充。</div></div></div></div>`;
    }

      state.project=null;

      renderSidebar();

      state.agents=payload.agents||[];
      state.agentSizeOptions=payload.image_size_options||[];
      state.agentQualityOptions=payload.image_quality_options||[];
      state.agentProjectVariables=payload.project_variable_options||[];
      $('#page-title').textContent='图片 Agents';
      $('#page-subtitle').textContent='点击进入 Agent 工作台后，再编辑定义、管理变量、绑定固定参考图并独立测试。';

    }

    function agentVariablesFromPrompt(prompt) {
      return state.agentProjectVariables.filter(item=>agentPromptHasVariable(prompt,item.name)).map(item=>item.name);
    }

    function renderAgentRuntimeFields(agent, currentValues={}) {
      const defaults={'产品名':'Agent独立测试产品','产品文字信息':'PU材质，慢回弹','产品描述':'PU材质，慢回弹','产品数量':'1','摆放展示要求':'产品完整、清晰、自然展示','自定义使用场景':'自然真实的日常使用场景','产品尺寸':''};
      const variables=agentProjectVariableDetails(agent).filter(item=>item.kind!=='image'&&item.name!=='是否系列品');
      const fields=variables.map(item=>{
        const value=currentValues[item.name]??defaults[item.name]??'';
        if(item.kind==='textarea') return `<div class="field"><label>${esc(item.label)} <span class="hint">{{${esc(item.name)}}}</span></label><textarea class="agent-run-input" data-variable="${esc(item.name)}">${esc(value)}</textarea></div>`;
        return `<div class="field"><label>${esc(item.label)} <span class="hint">{{${esc(item.name)}}}</span></label><input class="agent-run-input" data-variable="${esc(item.name)}" type="${item.kind==='number'?'number':'text'}" value="${esc(value)}"></div>`;
      }).join('');
      const seriesValue=currentValues['是否系列品']||'否';
      return `<div class="field"><label>测试产品类型 <span class="hint">决定 stt/cpt 的参考分工</span></label><select class="agent-run-input agent-run-product-type" data-variable="是否系列品"><option value="否" ${seriesValue!=='是'?'selected':''}>单品：stt 锁定外观与比例</option><option value="是" ${seriesValue==='是'?'selected':''}>系列品：cpt 锁定外观，stt 锁定比例</option></select></div>${fields||'<p class="hint">此 Agent 只使用图片变量，无需模拟填写其他文字项目字段。</p>'}`;
    }

    function collectAgentRuntimeValues(form) {
      const values={};
      $$('.agent-run-input',form).forEach(input=>values[input.dataset.variable]=input.value);
      return values;
    }

    function syncAgentImageRequirements(form) {
      if(!form||form.id!=='agent-run-form') return;
      const prompt=$('textarea[name="prompt"]',form)?.value||'';
      const variables=new Set(agentVariablesFromPrompt(prompt));
      const directCpt=variables.has('cpt')||variables.has('系列外观参考图');
      const series=$('.agent-run-product-type',form)?.value==='是';
      const cptInput=$('.agent-run-series-image',form);
      if(cptInput) {
        cptInput.dataset.directRequired=directCpt?'1':'0';
        cptInput.required=directCpt||series;
      }
      const cptHint=$('.agent-run-cpt-hint',form);
      if(cptHint) cptHint.textContent=directCpt?'描述词直接引用 cpt，测试时必须上传':series?'系列品测试必填':'单品不使用；系列品测试必填';
      const fixedCount=Number(form.dataset.fixedRefCount||0);
      const clearFixed=$('[name="clear_fixed_references"]',form)?.value==='1';
      const replacementCount=$('.agent-fixed-reference-input',form)?.files?.length||0;
      const hasFixed=replacementCount>0||(!clearFixed&&fixedCount>0);
      const taskInput=$('input[name="reference_images"]',form);
      const requiresTaskRef=variables.has('Agent参考图')&&!hasFixed;
      if(taskInput) taskInput.required=requiresTaskRef;
      const taskHint=$('.agent-run-task-ref-hint',form);
      if(taskHint) taskHint.textContent=requiresTaskRef?'描述词引用了 {{Agent参考图}} 且没有固定图，至少上传1张':hasFixed?'可选；会与固定参考图一起参与本次测试':'可选；本次测试临时补充，最多8张';
    }

    function syncAgentWorkspaceBindings(form) {
      if(!form||form.id!=='agent-run-form') return;
      const holder=$('.agent-runtime-text-fields',form);
      if(!holder) return;
      const currentValues=collectAgentRuntimeValues(form);
      const prompt=$('textarea[name="prompt"]',form)?.value||'';
      const agent={project_variables:agentVariablesFromPrompt(prompt)};
      holder.innerHTML=renderAgentRuntimeFields(agent,currentValues);
      syncAgentImageRequirements(form);
    }

    async function showAgentRunner(agentId='new') {
      const payload=await api('/api/agents');
      state.agents=payload.agents||[];
      state.agentSizeOptions=payload.image_size_options||[];
      state.agentQualityOptions=payload.image_quality_options||[];
      state.agentProjectVariables=payload.project_variable_options||[];
      const agent=agentId==='new'
        ? {id:'',name:'',prompt:'',image_size:'1024x1024',image_quality:'medium',project_variables:[],reference_paths:[]}
        : state.agents.find(item=>item.id===agentId);
      if(!agent) return toast('Agent 不存在或已删除');
      const result=agent.id?state.agentRunResults[agent.id]:null;
      const needsTaskRefs=(agent.project_variables||[]).includes('Agent参考图');
      const needsCpt=(agent.project_variables||[]).some(name=>name==='cpt'||name==='系列外观参考图');
      const hasFixedReferences=(agent.reference_paths||[]).length>0;
      state.project=null;
      clearInterval(state.poll);
      renderSidebar();

    async function saveAgentWorkspace(form,{rerender=false,quiet=false}={}) {
      const fd=new FormData();
      fd.set('agent_id',form.dataset.agentId||'');
      fd.set('name',$('[name="name"]',form).value);
      fd.set('image_size',$('[name="image_size"]',form).value);
      fd.set('image_quality',$('[name="image_quality"]',form).value);
      fd.set('prompt',$('[name="prompt"]',form).value);
      fd.set('clear_fixed_references',$('[name="clear_fixed_references"]',form)?.value||'0');
      const fixedInput=$('.agent-fixed-reference-input',form);
      [...(fixedInput?.files||[])].slice(0,8).forEach(file=>fd.append('fixed_reference_images',file));
      const payload=await api('/api/agents',{method:'POST',body:fd});
      form.dataset.agentId=payload.agent.id;
      form.dataset.fixedRefCount=String((payload.agent.reference_paths||[]).length);
      if(!quiet) toast('Agent 定义和固定参考图已保存');
      if(rerender) await showAgentRunner(payload.agent.id);
      return payload.agent;
    }

    async function submitAgentRun(form) {
      const button=$('button[type=submit]',form);
      const saveButton=$('[data-action="save-agent-workspace"]',form);
      button.disabled=true;
      if(saveButton) saveButton.disabled=true;
      button.textContent='正在保存并运行…';
      try {
        const saved=await saveAgentWorkspace(form,{quiet:true});
        const inputs=collectAgentRuntimeValues(form);
        const fd=new FormData(form);
        fd.set('inputs',JSON.stringify(inputs));
        const payload=await api(`/api/agents/${encodeURIComponent(saved.id)}/run`,{method:'POST',body:fd});
        state.agentRunResults[saved.id]=payload.run;
        toast('已按当前描述词重新出图；固定参考图已随 Agent 保存');
        await showAgentRunner(saved.id);
      } catch(e) {
        toast(e.message);
        button.disabled=false;
        if(saveButton) saveButton.disabled=false;
        button.textContent='保存并运行测试';
      }
    }

? '')}</textarea><textarea class="edit-input edit-box" placeholder="局部修改要求，例如：将产品缩小 15%，保持其他内容不变">${esc(state.editDrafts[task.id]||'')}</textarea><div class="card-actions"><button class="btn btn-primary" data-action="regenerate" ${busy?'disabled':''}>修改描述词重新生成</button><button class="btn btn-ghost" data-action="edit" ${busy||!version?'disabled':''}>直接编辑当前图片</button><button class="btn btn-light" data-action="approve" ${busy||!version?'disabled':''}>确认当前版本</button><button class="btn btn-light" data-action="download" ${!version?'disabled':''}>下载</button>${task.status==='failed'?'<button class="btn btn-danger" data-action="retry">重试</button>':''}</div>${task.last_error?`<div class="error">${esc(task.last_error)}</div>`:''}<div class="card-foot">${versions.length?`历史版本 ${versions.length} 个 · 父版本链可追溯`:'尚未产生版本'}${task.task_kind==='extra'?' · 本图来自额外参考图需求':''}${agentMeta}</div></div></article>`; }
    async function openProject(id) { clearInterval(state.poll); if(state.project?.id!==id) { state.promptDrafts={}; state.editDrafts={}; } state.project=await api(`/api/projects/${id}`); renderWorkspace(); state.poll=setInterval(async()=>{ if(!state.project) return; try { const updated=await api(`/api/projects/${state.project.id}`); state.project=updated; const active=document.activeElement; if(!active?.matches('.prompt-input,.edit-input')) renderWorkspace(); } catch(e){} },2200); }
     async function act(action, card) { const taskId=card.dataset.task; const task=state.project.tasks.find(t=>t.id===taskId); const promptValue=$('.prompt-input',card)?.value||''; const editValue=$('.edit-input',card)?.value||''; try { if(action==='regenerate') { delete state.viewVersions[taskId]; await api(`/api/tasks/${taskId}/regenerate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:promptValue})}); task.current_prompt=promptValue; delete state.promptDrafts[taskId]; toast('已提交重新生成'); } if(action==='edit') { delete state.viewVersions[taskId]; await api(`/api/tasks/${taskId}/edit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({change_request:editValue})}); delete state.editDrafts[taskId]; toast('已提交局部编辑'); } if(action==='approve') { const select=$('.version-select',card); await api(`/api/tasks/${taskId}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version_id:select.value})}); toast('已确认当前版本'); } if(action==='retry') { delete state.viewVersions[taskId]; await api(`/api/tasks/${taskId}/retry`,{method:'POST'}); toast('已重新排队'); } if(action==='download') { const select=$('.version-select',card); const version=(task.versions||[]).find(v=>v.id===(select?.value||task.selected_version_id)) || task.versions[task.versions.length-1]; if(version) window.open(fileUrl(state.project.id,version.file_path),'_blank'); } } catch(e){toast(e.message);} }
     async function refreshPrompts(button) { if(!state.project) return; button.disabled=true; button.textContent='分析中…'; try { await api(`/api/projects/${state.project.id}/refresh-prompts`,{method:'POST'}); state.project=await api(`/api/projects/${state.project.id}`); renderWorkspace(); toast('已为每一张图重新生成独立中文描述词'); } catch(e) { toast(e.message); button.disabled=false; button.textContent='重新分析全部描述词'; } }
     async function retryFailed(button) { if(!state.project) return; button.disabled=true; button.textContent='重新生成中…'; try { await api(`/api/projects/${state.project.id}/retry-failed`,{method:'POST'}); toast('失败任务已批量重新排队'); } catch(e) { toast(e.message); button.disabled=false; button.textContent='批量重试失败'; } }
     async function submitSettings(form) { const task_briefs={}; $$('.settings-task',form).forEach(el=>task_briefs[el.dataset.taskId]=el.value); const group_constraints={}; $('.group-constraint',form).forEach(el=>group_constraints[el.dataset.group]=el.value); const size_templates=$('.size-template-row',form).map(row=>({id:row.dataset.templateId,name:$('.size-template-name',row).value,prompt:$('.size-template-prompt',row).value})); const payload={output_root:$('[name=output_root]',form).value,image_api_base_url:$('[name=image_api_base_url]',form).value,image_api_key:$('[name=image_api_key]',form).value,image_model:$('[name=image_model]',form).value,image_size:$('[name=image_size]',form).value,image_quality:$('[name=image_quality]',form).value,image_moderation:$('[name=image_moderation]',form).value,image_output_format:$('[name=image_output_format]',form).value,prompt_api_base_url:$('[name=prompt_api_base_url]',form).value,prompt_api_key:$('[name=prompt_api_key]',form).value,prompt_model:$('[name=prompt_model]',form).value,generation_concurrency:$('[name=generation_concurrency]',form).value,api_timeout_seconds:$('[name=api_timeout_seconds]',form).value,max_upload_mb:$('[name=max_upload_mb]',form).value,mock_mode:$('[name=mock_mode]',form).checked,runtime:{group_constraints,task_briefs,size_templates}}; const button=$('button[type=submit]',form); button.disabled=true; button.textContent='保存中…'; try { await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); toast('设置已保存并立即生效'); await showSettings(); } catch(e) { toast(e.message); button.disabled=false; button.textContent='保存设置'; } }
    $('#top-new').onclick=showNew; $('#side-new').onclick=showNew; $('#side-settings').onclick=showSettings; $('#side-agents').onclick=()=>showAgents();
    function ensureImageQualitySelect() {
      const input=$('input[name="image_quality"]');
      if(!input) return;
      const labels={
        auto:'自动（由模型决定）',
        low:'低（速度快、成本低）',
        medium:'中（推荐，质量与成本平衡）',
        high:'高（细节最好、成本最高）'
      };
      const select=document.createElement('select');
      select.name='image_quality';
      select.innerHTML=Object.entries(labels).map(([value,label])=>`<option value="${value}" ${input.value===value?'selected':''}>${label}</option>`).join('');
      input.replaceWith(select);
    }
    const settingsViewObserver=new MutationObserver(ensureImageQualitySelect);
    settingsViewObserver.observe($('#view'),{childList:true,subtree:true});
    function ensureWorkspaceFunctionLabels() {
      $$('.logic-section > h3').forEach(el=>{
        if(el.firstChild?.nodeType===Node.TEXT_NODE && el.firstChild.textContent.trim()==='尺寸展示') el.firstChild.textContent='功能图 ';
      });
      $$('.task-card .hint').forEach(el=>{
        if(el.textContent.trim()==='· 尺寸展示') el.textContent='· 功能图';
      });
    }
    function ensureFavoriteButtons() {
      $$('.task-card').forEach(card=>{
        if($('.favorite-btn',card)) return;
        const top=$('.card-top',card);
        const status=$('.status',top);
        if(!top || !status) return;
        const actions=document.createElement('div');
        actions.className='card-top-actions';
        const button=document.createElement('button');
        button.type='button';
        button.className='favorite-btn';
        button.dataset.action='favorite';
        button.textContent='☆ 收藏';
        button.title='将当前版本图片和描述词保存到优质存档';
        button.disabled=!$('.version-select',card);
        status.replaceWith(actions);
        actions.append(button,status);
      });
    }
    async function favoriteTask(button) {
      const card=button.closest('[data-task]');
      const versionId=$('.version-select',card)?.value;
      if(!card || !versionId) return toast('当前图片还没有可收藏版本');
      const prompt=$('.prompt-input',card)?.value||'';
      button.disabled=true;
      button.textContent='收藏中…';
      try {
        await api(`/api/tasks/${card.dataset.task}/favorite`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({version_id:versionId,prompt})
        });
        button.textContent='★ 已收藏';
        toast('图片和描述词已保存到输出路径的“优质存档”文件夹');
      } catch(e) {
        button.disabled=false;
        button.textContent='☆ 收藏';
        toast(e.message);
      }
    }
    const projectViewObserver=new MutationObserver(()=>{
      ensureNewProjectEnhancements().catch(e=>toast(e.message));
      ensureWorkspaceFunctionLabels();
      ensureFavoriteButtons();
    });
    projectViewObserver.observe($('#view'),{childList:true,subtree:true});
    document.addEventListener('click', e=>{
      const btn=e.target.closest?.('[data-action]');
      if(!btn) return;
      if(btn.dataset.action==='favorite') {
        e.preventDefault();
        e.stopPropagation();
        favoriteTask(btn);
        return;
      }
      if(btn.dataset.action==='add-function') addFunctionRequest();
      if(btn.dataset.action==='insert-agent-variable') {
        e.preventDefault();
        e.stopPropagation();
        const textarea=$('textarea[name="prompt"]',btn.closest('form'));
        if(textarea) {
          const token=`{{${btn.dataset.variable}}}`;
          const start=textarea.selectionStart??textarea.value.length;
          const end=textarea.selectionEnd??start;
          const pattern=agentVariablePattern(btn.dataset.variable);
          if(pattern.test(textarea.value)) {
            pattern.lastIndex=0;
            textarea.value=textarea.value.replace(pattern,'');
            textarea.selectionStart=textarea.selectionEnd=Math.min(start,textarea.value.length);
          } else {
            textarea.value=textarea.value.slice(0,start)+token+textarea.value.slice(end);
            textarea.selectionStart=textarea.selectionEnd=start+token.length;
          }
          textarea.focus();
          syncAgentVariableButtons(btn.closest('form'));
        }
        return;
      }
      if(btn.dataset.action==='remove-function') {
        btn.closest('.function-request-row')?.remove();
        $$('.function-request-row').forEach((row,i)=>$('.extra-num',row).textContent=i+1);
      }
    },true);
    document.addEventListener('submit', e=>{
      if(e.target.id!=='project-form') return;
      const form=e.target;
      const requests=$$('.function-request-row',form).map((row,index)=>{
        const [source_type,source_id]=($('.function-source-select',row).value||'').split(':',2);
        if(source_type==='agent') {
          const reference_upload_key=`agent_ref_${index}`;
          const fileInput=$('.agent-request-files',row);
          if(fileInput) fileInput.name=reference_upload_key;
          return {source_type:'agent',agent_id:source_id,name:$('.function-task-name',row).value,reference_upload_key};
        }
        return {source_type:'template',template_id:source_id,name:$('.function-task-name',row).value};
      });
      let field=$('input[name="function_requests"]',form);
      if(!field) {
        field=document.createElement('input');
        field.type='hidden';
        field.name='function_requests';
        form.appendChild(field);
      }
      field.value=JSON.stringify(requests);
    },true);
    document.addEventListener('input', e=>{ if(e.target.matches?.('#agent-form textarea[name="prompt"]')) syncAgentVariableButtons(e.target.form); const card=e.target.closest?.('[data-task]'); if(!card) return; const taskId=card.dataset.task; if(e.target.matches('.prompt-input')) state.promptDrafts[taskId]=e.target.value; if(e.target.matches('.edit-input')) state.editDrafts[taskId]=e.target.value; });
     document.addEventListener('click', async e=>{ const open=e.target.closest('[data-open]'); if(open) return openProject(open.dataset.open); const btn=e.target.closest('[data-action]'); if(!btn) return; const action=btn.dataset.action; if(action==='new-agent') return showAgentRunner('new'); if(action==='edit-agent'||action==='run-agent') return showAgentRunner(btn.dataset.agentId); if(action==='back-agents') return showAgents(); if(action==='save-agent-workspace') { const form=btn.closest('#agent-run-form'); btn.disabled=true; btn.textContent='保存中…'; try { await saveAgentWorkspace(form,{rerender:true}); } catch(error) { toast(error.message); btn.disabled=false; btn.textContent='仅保存 Agent'; } return; } if(action==='clear-agent-fixed-refs') { const form=btn.closest('#agent-run-form'); $('[name="clear_fixed_references"]',form).value='1'; const input=$('.agent-fixed-reference-input',form); if(input) input.value=''; const refs=$('.agent-existing-refs',form); if(refs) refs.style.opacity='.35'; const hint=$('.fixed-reference-change-hint',form); if(hint) hint.textContent=Number(form.dataset.fixedRefCount||0)?'保存后将清空全部固定参考图。':'已取消本次待绑定图片。'; btn.disabled=Number(form.dataset.fixedRefCount||0)===0; syncAgentImageRequirements(form); return; } if(action==='delete-agent') { if(!confirm('确定删除这个 Agent 吗？固定参考图会一起删除；已创建项目中的任务和图片不受影响。')) return; try { await api(`/api/agents/${encodeURIComponent(btn.dataset.agentId)}`,{method:'DELETE'}); toast('Agent 已删除'); await showAgents(); } catch(error) { toast(error.message); } return; } if(action==='prompt-tab') { const section=btn.closest('.section'); $$('.logic-tab',section).forEach(el=>el.classList.toggle('active',el.dataset.group===btn.dataset.group)); $$('.constraint-panel',section).forEach(el=>el.classList.toggle('active',el.dataset.promptPanel===btn.dataset.group)); return; } if(action==='add-size-template') return addSizeTemplate(); if(action==='remove-size-template') { const rows=$$('.size-template-row'); if(rows.length<=1) return toast('至少保留一个尺寸图模板'); btn.closest('.size-template-row').remove(); return; } if(action==='new') return showNew(); if(action==='home') { state.project=null; renderSidebar(); showEmpty(); return; } if(action==='add-extra') return addExtra(); if(action==='remove-extra') { btn.closest('.extra-row').remove(); $$('.extra-row').forEach((row,i)=>$('.extra-num',row).textContent=i+1); return; } if(action==='toggle-tasks') { const boxes=$$('input[name=task_choice]'); const all=boxes.every(x=>x.checked); boxes.forEach(x=>x.checked=!all); return; } if(action==='refresh' && state.project) { state.project=await api(`/api/projects/${state.project.id}`); renderWorkspace(); return; } if(action==='refresh-prompts') return refreshPrompts(btn); if(action==='retry-failed') return retryFailed(btn); if(action==='delete-project' && state.project && confirm('确定软删除这个项目吗？图片不会立即清理。')) { await api(`/api/projects/${state.project.id}`,{method:'DELETE'}); toast('项目已移入回收状态'); state.project=null; await loadProjects(); showEmpty(); return; } const card=btn.closest('[data-task]'); if(card && ['regenerate','edit','approve','retry','download'].includes(action)) return act(action,card); });
    document.addEventListener('change', e=>{ if(e.target.matches('[name="is_series"]')) { const input=$('[name="series_image"]',e.target.form); const hint=$('.series-reference-hint',e.target.form); const series=e.target.value==='1'; if(input) input.required=series; if(hint) hint.textContent=series?'系列品必填；锁定具体产品外观':'单品不使用；系列品必填并锁定具体产品外观'; } if(e.target.matches('.agent-run-product-type')) syncAgentImageRequirements(e.target.form); if(e.target.matches('.agent-fixed-reference-input')) { const form=e.target.form; if(e.target.files.length) $('[name="clear_fixed_references"]',form).value='0'; const clearButton=$('[data-action="clear-agent-fixed-refs"]',form); if(clearButton) clearButton.disabled=!e.target.files.length&&Number(form.dataset.fixedRefCount||0)===0; const hint=$('.fixed-reference-change-hint',form); if(hint) hint.textContent=e.target.files.length?`已选择 ${e.target.files.length} 张；保存后替换当前全部固定参考图。`:'未选择新图片。'; syncAgentImageRequirements(form); } if(e.target.matches('.function-source-select')) updateFunctionRequestRow(e.target.closest('.function-request-row')); if(e.target.matches('[data-action="view-version"]')) { state.viewVersions[e.target.closest('[data-task]').dataset.task]=e.target.value; renderWorkspace(); } });
     document.addEventListener('submit', e=>{ if(e.target.id==='project-form'){e.preventDefault(); submitProject(e.target);} if(e.target.id==='settings-form'){e.preventDefault(); submitSettingsFixed(e.target);} if(e.target.id==='agent-run-form'){e.preventDefault(); submitAgentRun(e.target);} });
    (async()=>{ try { await loadProjects(); if(state.projects.length) await openProject(state.projects[0].id); else showEmpty(); } catch(e){toast(e.message);} })();
  </script>
</body>
